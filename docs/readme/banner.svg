<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Nyaya Nagri animated banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1E3A"/>
      <stop offset="0.55" stop-color="#14325E"/>
      <stop offset="1" stop-color="#1B4478"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5B700" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F5B700" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="240" rx="14" fill="url(#sky)"/>

  <!-- twinkling stars -->
  <g fill="#FFFFFF">
    <circle cx="80" cy="38" r="2"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="2.8s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="70" r="1.6"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="30" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="22" r="2.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="34" r="1.7"><animate attributeName="opacity" values="1;0.25;1" dur="2.6s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="66" r="1.9"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.6s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="40" r="2"><animate attributeName="opacity" values="0.85;0.15;0.85" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="120" r="1.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="945" cy="130" r="1.5"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.2s" begin="0.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- soft golden glow behind title -->
  <ellipse cx="500" cy="105" rx="310" ry="85" fill="url(#glow)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- left scales of justice (beam swings gently) -->
  <g transform="translate(140,62)" stroke="#F5B700" fill="#F5B700">
    <circle cx="0" cy="-16" r="5" stroke="none"/>
    <line x1="0" y1="-14" x2="0" y2="58" stroke-width="4"/>
    <rect x="-22" y="58" width="44" height="6" rx="3" stroke="none"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 0 -10;6 0 -10;-6 0 -10" dur="4.5s" repeatCount="indefinite"/>
      <line x1="-52" y1="-10" x2="52" y2="-10" stroke-width="4"/>
      <line x1="-52" y1="-10" x2="-52" y2="18" stroke-width="2"/>
      <line x1="52" y1="-10" x2="52" y2="18" stroke-width="2"/>
      <path d="M-70,18 a18,11 0 0,0 36,0 z" stroke="none"/>
      <path d="M34,18 a18,11 0 0,0 36,0 z" stroke="none"/>
    </g>
  </g>

  <!-- right scales of justice -->
  <g transform="translate(860,62)" stroke="#F5B700" fill="#F5B700">
    <circle cx="0" cy="-16" r="5" stroke="none"/>
    <line x1="0" y1="-14" x2="0" y2="58" stroke-width="4"/>
    <rect x="-22" y="58" width="44" height="6" rx="3" stroke="none"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="5 0 -10;-5 0 -10;5 0 -10" dur="5.2s" repeatCount="indefinite"/>
      <line x1="-52" y1="-10" x2="52" y2="-10" stroke-width="4"/>
      <line x1="-52" y1="-10" x2="-52" y2="18" stroke-width="2"/>
      <line x1="52" y1="-10" x2="52" y2="18" stroke-width="2"/>
      <path d="M-70,18 a18,11 0 0,0 36,0 z" stroke="none"/>
      <path d="M34,18 a18,11 0 0,0 36,0 z" stroke="none"/>
    </g>
  </g>

  <!-- title -->
  <text x="500" y="102" text-anchor="middle" font-family="Georgia, 'Noto Serif Devanagari', serif" font-size="54" font-weight="bold" fill="#FFD75E">न्याय नगरी</text>
  <text x="500" y="146" text-anchor="middle" font-family="Trebuchet MS, Verdana, sans-serif" font-size="24" letter-spacing="13" fill="#FFFFFF">NYAYA NAGRI</text>
  <text x="500" y="176" text-anchor="middle" font-family="Trebuchet MS, Verdana, sans-serif" font-size="15" fill="#CFE0FF" opacity="0.92">A gamified city where children learn their rights — by playing</text>

  <!-- animated tricolor waves -->
  <g transform="translate(0,196)" fill="none" stroke-linecap="round">
    <path d="M0,12 Q125,-8 250,12 T500,12 T750,12 T1000,12 T1250,12 T1500,12" stroke="#FF9933" stroke-width="4" opacity="0.95">
      <animateTransform attributeName="transform" type="translate" values="0 0;-500 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M0,22 Q125,4 250,22 T500,22 T750,22 T1000,22 T1250,22 T1500,22" stroke="#F2F5FA" stroke-width="3" opacity="0.85">
      <animateTransform attributeName="transform" type="translate" values="0 0;-500 0" dur="9.5s" repeatCount="indefinite"/>
    </path>
    <path d="M0,32 Q125,16 250,32 T500,32 T750,32 T1000,32 T1250,32 T1500,32" stroke="#35B36B" stroke-width="4" opacity="0.95">
      <animateTransform attributeName="transform" type="translate" values="0 0;-500 0" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
