<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 26" width="1000" height="26" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="tri" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9933" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#FF9933"/>
      <stop offset="0.5" stop-color="#9AA7B8"/>
      <stop offset="0.82" stop-color="#138808"/>
      <stop offset="1" stop-color="#138808" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="11" width="1000" height="3" rx="1.5" fill="url(#tri)"/>

  <rect x="-160" y="11" width="160" height="3" rx="1.5" fill="url(#shine)">
    <animate attributeName="x" values="-160;1000" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <circle cx="500" cy="12.5" r="4" fill="#F5B700">
    <animate attributeName="r" values="3;5;3" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="478" cy="12.5" r="2" fill="#FF9933">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="522" cy="12.5" r="2" fill="#35B36B">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
</svg>
